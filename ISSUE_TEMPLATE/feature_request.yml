name: Feature request
description: Propose an improvement or a new Qt component.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Please explain the user problem first. A focused proposal is easier to evaluate than an implementation-only request.
  - type: input
    id: project
    attributes:
      label: Target project
      placeholder: HesWidgetsGalleryPrivate
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Who needs this, and what is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the desired API, behavior, or visual result. Include alternatives considered.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Compatibility and scope
      description: Note affected platforms, Qt versions, accessibility concerns, and whether this is a breaking change.
  - type: textarea
    id: examples
    attributes:
      label: Examples or references
      description: Add sketches, screenshots, links, or comparable Qt/Fluent controls.
